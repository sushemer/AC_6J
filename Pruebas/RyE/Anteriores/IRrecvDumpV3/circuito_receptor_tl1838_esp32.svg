<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f7fafc"/>
  <style>
    .title { font: 700 32px Arial, sans-serif; fill:#17202a; }
    .subtitle { font: 20px Arial, sans-serif; fill:#34495e; }
    .label { font: 700 22px Arial, sans-serif; fill:#17202a; }
    .text { font: 19px Arial, sans-serif; fill:#17202a; }
    .small { font: 17px Arial, sans-serif; fill:#34495e; }
    .wire { stroke:#263238; stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .vcc { stroke:#c0392b; stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .gnd { stroke:#21618c; stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .signal { stroke:#16803c; stroke-width:5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .box { fill:#eaf2f8; stroke:#2874a6; stroke-width:3; rx:18; }
    .sensor { fill:#fff3cd; stroke:#b9770e; stroke-width:3; rx:12; }
    .part { fill:#ffffff; stroke:#566573; stroke-width:3; }
    .note { fill:#fff; stroke:#7f8c8d; stroke-width:2; rx:12; }
  </style>

  <text x="700" y="55" text-anchor="middle" class="title">Circuito del receptor TL1838 con ESP32 DevKit V1</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">Alimentación segura a 3.3 V — salida del receptor al GPIO22</text>

  <!-- ESP32 -->
  <rect x="75" y="220" width="350" height="390" class="box"/>
  <text x="250" y="270" text-anchor="middle" class="label">ESP32 DevKit V1</text>
  <text x="250" y="300" text-anchor="middle" class="small">ESP32 clásico / WROOM-32</text>
  <rect x="145" y="350" width="210" height="130" fill="#d5dbdb" stroke="#566573" stroke-width="3" rx="8"/>
  <text x="250" y="405" text-anchor="middle" class="label">GPIO22</text>
  <text x="250" y="435" text-anchor="middle" class="small">Entrada IR</text>
  <text x="250" y="535" text-anchor="middle" class="label">3V3</text>
  <text x="250" y="570" text-anchor="middle" class="label">GND</text>

  <!-- TL1838 -->
  <rect x="955" y="250" width="300" height="260" class="sensor"/>
  <ellipse cx="1105" cy="295" rx="48" ry="28" fill="#333" stroke="#111" stroke-width="3"/>
  <text x="1105" y="370" text-anchor="middle" class="label">TL1838</text>
  <text x="1105" y="402" text-anchor="middle" class="small">receptor demodulado 38 kHz</text>
  <text x="1005" y="475" class="label">1 OUT</text>
  <text x="1080" y="475" class="label">2 GND</text>
  <text x="1160" y="475" class="label">3 VCC</text>
  <line x1="1015" y1="510" x2="1015" y2="560" class="signal"/>
  <line x1="1105" y1="510" x2="1105" y2="590" class="gnd"/>
  <line x1="1195" y1="510" x2="1195" y2="180" class="vcc"/>

  <!-- GPIO signal -->
  <path d="M355 415 H620 V510 H1015" class="signal"/>
  <text x="650" y="398" class="label" fill="#16803c">Señal IR</text>
  <text x="650" y="430" class="text">OUT → GPIO22</text>

  <!-- Pull-up resistor -->
  <path d="M760 510 V450" class="signal"/>
  <rect x="735" y="355" width="50" height="95" class="part"/>
  <path d="M760 355 V180" class="vcc"/>
  <text x="810" y="402" class="label">R1 = 10 kΩ</text>
  <text x="810" y="430" class="small">pull-up de OUT a 3V3</text>

  <!-- VCC rail -->
  <path d="M250 535 H520 V180 H1195" class="vcc"/>
  <text x="520" y="165" class="label" fill="#c0392b">3V3</text>
  <text x="1210" y="195" class="small" fill="#c0392b">VCC pin 3</text>

  <!-- Ground rail -->
  <path d="M250 570 H520 V690 H1105 V590" class="gnd"/>
  <line x1="500" y1="690" x2="540" y2="690" class="gnd"/>
  <line x1="510" y1="690" x2="510" y2="725" class="gnd"/>
  <line x1="490" y1="725" x2="530" y2="725" class="gnd"/>
  <line x1="497" y1="738" x2="523" y2="738" class="gnd"/>
  <line x1="504" y1="751" x2="516" y2="751" class="gnd"/>
  <text x="545" y="685" class="label" fill="#21618c">GND común</text>

  <!-- C1 -->
  <line x1="650" y1="180" x2="650" y2="300" class="vcc"/>
  <line x1="610" y1="300" x2="690" y2="300" class="wire"/>
  <line x1="610" y1="320" x2="690" y2="320" class="wire"/>
  <line x1="650" y1="320" x2="650" y2="690" class="gnd"/>
  <text x="675" y="285" class="label">C1</text>
  <text x="675" y="345" class="text">47 µF</text>
  <text x="675" y="370" class="small">electrolítico: + arriba</text>

  <!-- C2 -->
  <line x1="885" y1="180" x2="885" y2="300" class="vcc"/>
  <line x1="845" y1="300" x2="925" y2="300" class="wire"/>
  <line x1="845" y1="320" x2="925" y2="320" class="wire"/>
  <line x1="885" y1="320" x2="885" y2="690" class="gnd"/>
  <text x="910" y="285" class="label">C2</text>
  <text x="910" y="345" class="text">10 µF opcional</text>
  <text x="910" y="370" class="small">electrolítico: + arriba</text>

  <!-- Notes -->
  <rect x="75" y="735" width="1180" height="110" class="note"/>
  <text x="100" y="770" class="label">Importante</text>
  <text x="100" y="800" class="text">Mira el TL1838 por la cara de la lente con las patas hacia abajo: 1=OUT, 2=GND, 3=VCC.</text>
  <text x="100" y="828" class="text">El capacitor de 47 µF es provisional; después conviene agregar 100 nF cerámico. No uses 5 V en OUT.</text>
</svg>
